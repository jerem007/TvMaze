<article class="serie-card">

  <img
    class="serie-image"
    [src]="serie().image?.medium"
    [alt]="serie().name"
  />

  <div class="serie-info">
    <h3 class="serie-title">{{ serie().name }}</h3>
  </div>

  <a
    class="serie-link"
    [routerLink]="'/detail/' + serie().id"
  >
    Voir le détail
  </a>

</article>
