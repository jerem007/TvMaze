<header class="main-header">

    <nav class="main-nav">

        <ul class="nav-list">

            <li class="nav-logo">
                <a class="logo" routerLink="/">
                    <span class="logo-icon">TV</span>
                    <span class="logo-text">Maze</span>
                </a>
            </li>

            @if (isHome()) {
                <li>
                    <form class="search-form" (submit)="onSubmit($event)">
                        <input type="text" placeholder="Rechercher une série..." [formField]="form.search" />

                        <button type="submit" class="search-button">
                            Rechercher
                        </button>
                    </form>
                </li>
            }

            <li>
                <button
                    class="adult-mode-button"
                    [class.active]="adultModeService.isAuthorized()"
                    [attr.aria-pressed]="adultModeService.isAuthorized()"
                    (click)="toggleAdultMode()"
                >
                    <span class="adult-mode-badge" aria-hidden="true">18+</span>
                    <span>{{ adultModeService.isAuthorized() ? 'Désactiver' : 'Activer' }} le mode adulte</span>
                </button>
            </li>

            <li>
                <a class="nav-link" routerLink="/favorites">
                    Mes favoris
                </a>
            </li>

        </ul>

    </nav>

</header>
